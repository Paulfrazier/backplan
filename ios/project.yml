name: Backplan
options:
  bundleIdPrefix: website.fairpoint
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 2

targets:
  Backplan:
    type: application
    platform: iOS
    sources:
      - path: Backplan
        excludes:
          - "**/.DS_Store"
      # ActivityAttributes has to compile into both processes, so the payload's
      # shape can never drift between the app and the widget.
      - path: Shared
    dependencies:
      - target: BackplanWidgets
        embed: true
    settings:
      base:
        INFOPLIST_FILE: Backplan/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: website.fairpoint.backplan
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DFG7YZ82LP
    info:
      path: Backplan/Info.plist
      properties:
        CFBundleDisplayName: Backplan
        CFBundleName: Backplan
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Travel steps call photon.komoot.io and brouter.de over plain HTTPS.
        # That is standard TLS with no custom cryptography, which is an exempt
        # use — so this stays false and keeps clearing "Missing Compliance"
        # automatically on every TestFlight upload. No ATS exception is needed
        # either, since both hosts are HTTPS.
        ITSAppUsesNonExemptEncryption: false
        # Without this the Live Activity request fails silently — no error, no
        # card, just `Activity.request` throwing `unsupportedTarget`.
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: "LaunchBrand"
          UIImageName: ""
        UIAppFonts:
          - SpaceGrotesk.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}

  # Exists only to host the Live Activity: a Live Activity's views have to run
  # in a widget extension, even when the app ships no Home Screen widgets.
  BackplanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BackplanWidgets
        excludes:
          - "**/.DS_Store"
      - path: Shared
      # Just the palette — the widget draws in Backplan's colours, and pulling
      # the whole app in would drag PlanStore and the network services with it.
      - path: Backplan/Extensions/Color+Theme.swift
    settings:
      base:
        INFOPLIST_FILE: BackplanWidgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: website.fairpoint.backplan.widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DFG7YZ82LP
        SKIP_INSTALL: YES
    info:
      path: BackplanWidgets/Info.plist
      properties:
        CFBundleDisplayName: Backplan
        CFBundleName: Backplan
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
