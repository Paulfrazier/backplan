name: Backplan
options:
  bundleIdPrefix: website.fairpoint
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  Backplan:
    type: application
    platform: iOS
    sources:
      - path: Backplan
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: Backplan/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: website.fairpoint.backplan
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DFG7YZ82LP
    info:
      path: Backplan/Info.plist
      properties:
        CFBundleDisplayName: Backplan
        CFBundleName: Backplan
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: "LaunchBrand"
          UIImageName: ""
        UIAppFonts:
          - SpaceGrotesk.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
